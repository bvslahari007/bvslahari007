name: Generate Activity Assets

on:
  # Regenerate a few times a day so the snake and pulse chart stay current
  schedule:
    - cron: "0 */12 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Also regenerate on pushes to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # README references the -dark variant; the light one is generated too as a fallback
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate monthly pulse chart (Star Chart deck)
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          # Falls back to the default token; add a classic PAT secret named
          # PULSE_TOKEN if the default token can't read contribution data.
          GH_TOKEN: ${{ secrets.PULSE_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/generate-pulse.js

      - name: Push generated assets to the output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
