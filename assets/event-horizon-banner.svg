<svg width="100%" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">

  <!-- ============================================================
       COSMIC BLACK HOLE — self-contained SVG, no external assets.
       Palette: fiery orange / deep magenta / neon blue, used
       consistently across the event horizon, disk, and lensing.
       ============================================================ -->

  <defs>
    <!-- deep space background -->
    <radialGradient id="spaceBg" cx="50%" cy="46%" r="75%">
      <stop offset="0%"  stop-color="#0a0410"/>
      <stop offset="100%" stop-color="#05020a"/>
    </radialGradient>

    <!-- soft colour haze sitting behind the disk -->
    <radialGradient id="hazeMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#C81D6E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C81D6E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hazeBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#1AA7E0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1AA7E0" stop-opacity="0"/>
    </radialGradient>

    <!-- accretion-disk ring gradients: outer(cool) -> mid -> inner(hot) -->
    <linearGradient id="ringOuter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#34D6FF"/>
      <stop offset="100%" stop-color="#C81D6E"/>
    </linearGradient>
    <linearGradient id="ringMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#C81D6E"/>
      <stop offset="100%" stop-color="#FF6B1A"/>
    </linearGradient>
    <linearGradient id="ringInner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF9A4D"/>
      <stop offset="50%"  stop-color="#FF6B1A"/>
      <stop offset="100%" stop-color="#FFD9A0"/>
    </linearGradient>

    <!-- turbulence streak gradients -->
    <linearGradient id="streakOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD9A0"/>
      <stop offset="100%" stop-color="#FF6B1A"/>
    </linearGradient>
    <linearGradient id="streakBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B5F3FF"/>
      <stop offset="100%" stop-color="#34D6FF"/>
    </linearGradient>
    <linearGradient id="streakMagenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B9E"/>
      <stop offset="100%" stop-color="#C81D6E"/>
    </linearGradient>

    <!-- gravitational-lensing arcs: light warped over/under the horizon -->
    <linearGradient id="lensTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#34D6FF"/>
      <stop offset="40%"  stop-color="#FFD9A0"/>
      <stop offset="70%"  stop-color="#FF6B1A"/>
      <stop offset="100%" stop-color="#C81D6E"/>
    </linearGradient>
    <linearGradient id="lensBottom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#C81D6E"/>
      <stop offset="50%"  stop-color="#34D6FF"/>
      <stop offset="100%" stop-color="#6A1A4A"/>
    </linearGradient>

    <!-- photon sphere: intensely glowing thin ring at the horizon edge -->
    <radialGradient id="photonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="22%"  stop-color="#FFE3B0"/>
      <stop offset="55%"  stop-color="#34D6FF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#34D6FF" stop-opacity="0"/>
    </radialGradient>

    <!-- soft glow for disk elements -->
    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- stronger glow for the hottest / brightest elements -->
    <filter id="glowStrong" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- wide blur for background nebula haze -->
    <filter id="hazeBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- ===================== BACKGROUND ===================== -->
  <rect width="900" height="500" fill="url(#spaceBg)"/>

  <!-- nebula colour haze, purely decorative, very low opacity -->
  <ellipse cx="300" cy="180" rx="220" ry="140" fill="url(#hazeMagenta)" filter="url(#hazeBlur)"/>
  <ellipse cx="640" cy="340" rx="220" ry="140" fill="url(#hazeBlue)" filter="url(#hazeBlur)"/>

  <!-- scattered stars, varied size / opacity, a few gently twinkling -->
  <g fill="#F2ECE4">
    <circle cx="48" cy="52" r="1.1" opacity="0.8"/>
    <circle cx="96" cy="90" r="0.8" opacity="0.5"/>
    <circle cx="150" cy="40" r="1.4" opacity="0.9"/>
    <circle cx="205" cy="110" r="0.9" opacity="0.4"/>
    <circle cx="120" cy="150" r="1" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="230" r="1.2" opacity="0.6"/>
    <circle cx="30" cy="330" r="0.9" opacity="0.5"/>
    <circle cx="100" cy="400" r="1.3" opacity="0.8"/>
    <circle cx="170" cy="440" r="0.8" opacity="0.4"/>
    <circle cx="60" cy="460" r="1.1" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="60" r="1.2" opacity="0.8"/>
    <circle cx="780" cy="110" r="0.9" opacity="0.5"/>
    <circle cx="860" cy="150" r="1" opacity="0.6"/>
    <circle cx="740" cy="60" r="1.1" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="250" r="1.3" opacity="0.75"/>
    <circle cx="800" cy="330" r="0.8" opacity="0.4"/>
    <circle cx="860" cy="400" r="1" opacity="0.6"/>
    <circle cx="770" cy="440" r="1.2" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="30" r="0.9" opacity="0.5"/>
    <circle cx="380" cy="470" r="1" opacity="0.6"/>
    <circle cx="520" cy="470" r="0.8" opacity="0.4"/>
    <circle cx="300" cy="60" r="1" opacity="0.6"/>
    <circle cx="600" cy="40" r="1.1" opacity="0.55"/>
  </g>

  <!-- ===================== ACCRETION DISK ===================== -->
  <!-- concentric rings, cool/outer -> hot/inner, painted before the
       event horizon so the disk reads as passing behind it -->
  <g>
    <ellipse cx="450" cy="250" rx="330" ry="78" fill="none"
             stroke="url(#ringOuter)" stroke-width="5" opacity="0.55" filter="url(#glowSoft)"/>
    <ellipse cx="450" cy="250" rx="265" ry="62" fill="none"
             stroke="url(#ringMid)" stroke-width="9" opacity="0.8" filter="url(#glowSoft)"/>
    <ellipse cx="450" cy="250" rx="195" ry="46" fill="none"
             stroke="url(#ringInner)" stroke-width="13" opacity="0.95" filter="url(#glowStrong)"/>
  </g>

  <!-- turbulence streaks: short bright accents suggesting swirling motion -->
  <g fill="none" stroke-linecap="round">
    <path d="M 560 215 Q 610 190 655 222" stroke="url(#streakOrange)" stroke-width="4" opacity="0.9" filter="url(#glowSoft)"/>
    <path d="M 340 300 Q 280 332 218 296" stroke="url(#streakBlue)" stroke-width="3" opacity="0.8" filter="url(#glowSoft)"/>
    <path d="M 262 206 Q 210 176 162 208" stroke="url(#streakMagenta)" stroke-width="3" opacity="0.75" filter="url(#glowSoft)"/>
    <path d="M 640 290 Q 702 322 738 284" stroke="url(#streakOrange)" stroke-width="3.5" opacity="0.85" filter="url(#glowSoft)"/>
  </g>

  <!-- gravitational lensing: warped light bent above and below the hole -->
  <path d="M 130 250 Q 450 66 770 250" fill="none" stroke="url(#lensTop)"
        stroke-width="6" opacity="0.85" filter="url(#glowStrong)" stroke-linecap="round"/>
  <path d="M 170 250 Q 450 404 730 250" fill="none" stroke="url(#lensBottom)"
        stroke-width="4" opacity="0.5" filter="url(#glowSoft)" stroke-linecap="round"/>

  <!-- slow rotating debris accents for a sense of motion -->
  <g opacity="0.6">
    <circle cx="450" cy="250" r="230" fill="none" stroke="#34D6FF" stroke-width="1" stroke-dasharray="1 14" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0 450 250" to="360 450 250" dur="60s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===================== PHOTON SPHERE + EVENT HORIZON ===================== -->
  <!-- intense glow halo directly around the horizon -->
  <circle cx="450" cy="250" r="100" fill="url(#photonGlow)"/>

  <!-- pure, light-absorbing event horizon, masks the disk's centre -->
  <circle cx="450" cy="250" r="68" fill="#05020a"/>

  <!-- thin, crisp, intensely glowing photon-sphere ring at the very edge -->
  <circle cx="450" cy="250" r="69.5" fill="none" stroke="#EAFBFF" stroke-width="2"
          opacity="0.95" filter="url(#glowStrong)"/>

</svg>
