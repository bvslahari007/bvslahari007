<svg width="100%" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="spacebg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#05060a"/>
    <stop offset="100%" stop-color="#0d0f14"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect width="900" height="300" fill="url(#spacebg)"/>

<g fill="#8A94A6">
  <circle cx="52" cy="38" r="1.1"/>
  <circle cx="97" cy="66" r="1"/>
  <circle cx="140" cy="24" r="1.3"/>
  <circle cx="188" cy="90" r="1"/>
  <circle cx="230" cy="46" r="1.1">
    <animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="200" r="1"/>
  <circle cx="120" cy="240" r="1.2"/>
  <circle cx="60" cy="270" r="1"/>
  <circle cx="150" cy="180" r="1.1">
    <animate attributeName="opacity" values="1;0.2;1" dur="4.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="40" r="1.2"/>
  <circle cx="770" cy="80" r="1"/>
  <circle cx="810" cy="30" r="1.1"/>
  <circle cx="850" cy="70" r="1"/>
  <circle cx="690" cy="100" r="1.2">
    <animate attributeName="opacity" values="1;0.2;1" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="220" r="1"/>
  <circle cx="850" cy="250" r="1.2"/>
  <circle cx="760" cy="260" r="1"/>
  <circle cx="700" cy="230" r="1.1">
    <animate attributeName="opacity" values="1;0.2;1" dur="4.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="440" cy="30" r="1"/>
  <circle cx="480" cy="270" r="1"/>
  <circle cx="360" cy="270" r="1.1"/>
  <circle cx="540" cy="20" r="1"/>
</g>

<g transform="translate(450,150)">
  <g stroke="#8A94A6" stroke-width="1" opacity="0.45" fill="none">
    <circle r="118" stroke-dasharray="3 7"/>
    <line x1="-134" y1="0" x2="-124" y2="0"/>
    <line x1="134" y1="0" x2="124" y2="0"/>
    <line x1="0" y1="-134" x2="0" y2="-124"/>
    <line x1="0" y1="134" x2="0" y2="124"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="50s" repeatCount="indefinite"/>
  </g>

  <g filter="url(#glow)">
    <path d="M -160 0 Q 0 -95 160 0" stroke="#F2B679" stroke-width="4" fill="none" opacity="0.8"/>
    <path d="M -160 0 Q 0 78 160 0" stroke="#B9722E" stroke-width="3" fill="none" opacity="0.45"/>
    <ellipse rx="150" ry="34" fill="none" stroke="#D98E4A" stroke-width="7" opacity="0.9"/>
  </g>

  <circle r="58" fill="#05060a"/>
  <circle r="59" fill="none" stroke="#1a1712" stroke-width="1.5"/>
</g>

<text x="30" y="278" font-family="'Courier New',monospace" font-size="11" letter-spacing="2" fill="#8A94A6">COORD LOCK // GARGANTUA</text>
<text x="870" y="278" text-anchor="end" font-family="'Courier New',monospace" font-size="11" letter-spacing="2" fill="#D98E4A">STATUS // STABLE ORBIT</text>
</svg>
