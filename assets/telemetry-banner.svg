<svg width="100%" height="350" viewBox="0 0 1600 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cinematic animated black hole with rotating accretion disk and gravitational lensing">

  <!-- ============================================================
       CINEMATIC BLACK HOLE — self-contained SVG (SMIL only,
       no JS/CSS/external assets). Deep blues, purples, cyan and
       white-hot plasma around a pure-black event horizon.
       ============================================================ -->

  <defs>
    <filter id="bh-blurS" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="bh-blurM" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="bh-blurL" x="-140%" y="-140%" width="380%" height="380%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="bh-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="bh-horizon" cx="46%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="78%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0a0420"/>
    </radialGradient>
    <radialGradient id="bh-burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#BFEFFF"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bh-crescent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAF6FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#EAF6FF" stop-opacity="0"/>
    </linearGradient>

    <!-- disk orbit guide paths (doubled-arc technique: draws a full ellipse) -->
    <path id="bh-orbitIn"  d="M 632 175 A 168 44 0 1 1 968 175 A 168 44 0 1 1 632 175"/>
    <path id="bh-orbitMid" d="M 578 175 A 222 58 0 1 1 1022 175 A 222 58 0 1 1 578 175"/>
    <path id="bh-orbitOut" d="M 522 175 A 278 72 0 1 1 1078 175 A 278 72 0 1 1 522 175"/>
    <path id="bh-orbitFar" d="M 470 175 A 330 86 0 1 1 1130 175 A 330 86 0 1 1 470 175"/>
  </defs>

  <!-- ===================== BACKGROUND: deep space ===================== -->
  <rect width="1600" height="350" fill="#05020a"/>

  <!-- soft nebula depth blobs (slow parallax drift + breathing) -->
  <g filter="url(#bh-blurL)">
    <ellipse cx="230" cy="95" rx="220" ry="140" fill="#3a1f78" opacity="0.28">
      <animate attributeName="opacity" values="0.22;0.34;0.22" dur="19s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 14,-8; 0,0" dur="38s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1370" cy="265" rx="240" ry="150" fill="#0f2f7a" opacity="0.26">
      <animate attributeName="opacity" values="0.2;0.32;0.2" dur="23s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; -16,10; 0,0" dur="44s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="800" cy="175" rx="430" ry="230" fill="#2a1256" opacity="0.16">
      <animate attributeName="opacity" values="0.12;0.2;0.12" dur="15s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- starfield -->
  <g fill="#CFE9FF">
    <circle cx="45" cy="40" r="1" opacity="0.5"/>
    <circle cx="120" cy="70" r="0.8" opacity="0.35"/>
    <circle cx="80" cy="120" r="1.1" opacity="0.55"/>
    <circle cx="180" cy="30" r="0.9" opacity="0.4"/>
    <circle cx="40" cy="200" r="1" opacity="0.5"/>
    <circle cx="150" cy="250" r="0.8" opacity="0.35"/>
    <circle cx="90" cy="300" r="1" opacity="0.45">
      <animate attributeName="opacity" values="0.45;0.1;0.45" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="90" r="0.9" opacity="0.4"/>
    <circle cx="1540" cy="45" r="1" opacity="0.5"/>
    <circle cx="1470" cy="80" r="0.8" opacity="0.35"/>
    <circle cx="1500" cy="140" r="1.1" opacity="0.5"/>
    <circle cx="1420" cy="35" r="0.9" opacity="0.4"/>
    <circle cx="1560" cy="210" r="1" opacity="0.5"/>
    <circle cx="1450" cy="260" r="0.8" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.08;0.35" dur="6.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1510" cy="305" r="1" opacity="0.45"/>
    <circle cx="1400" cy="150" r="0.9" opacity="0.4"/>
    <circle cx="380" cy="35" r="0.9" opacity="0.4"/>
    <circle cx="450" cy="60" r="0.8" opacity="0.3"/>
    <circle cx="1150" cy="35" r="0.9" opacity="0.4"/>
    <circle cx="1220" cy="65" r="0.8" opacity="0.3"/>
    <circle cx="330" cy="315" r="0.9" opacity="0.4"/>
    <circle cx="410" cy="330" r="0.8" opacity="0.3"/>
    <circle cx="1190" cy="315" r="0.9" opacity="0.4"/>
    <circle cx="1260" cy="330" r="0.8" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.06;0.3" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="15" r="0.8" opacity="0.3"/>
    <circle cx="800" cy="335" r="0.8" opacity="0.3"/>
    <circle cx="60" cy="10" r="0.9" opacity="0.4"/>
    <circle cx="1550" cy="335" r="0.9" opacity="0.4"/>
  </g>

  <!-- foreground parallax specks (slightly brighter, slow drift) -->
  <g fill="#EAF6FF">
    <circle cx="260" cy="160" r="1.4" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0,0; -10,6; 0,0" dur="27s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1340" cy="120" r="1.3" opacity="0.45">
      <animateTransform attributeName="transform" type="translate" values="0,0; 9,-7; 0,0" dur="31s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1300" cy="290" r="1.2" opacity="0.4">
      <animateTransform attributeName="transform" type="translate" values="0,0; -8,-6; 0,0" dur="24s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===================== gravitational lensing (Einstein rings) ===================== -->
  <g fill="none" stroke="#7FE9FF">
    <circle cx="800" cy="175" r="150" stroke-width="1" stroke-dasharray="1 6" opacity="0.16">
      <animate attributeName="opacity" values="0.1;0.22;0.1" dur="9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="0 800 175" to="360 800 175" dur="70s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="175" r="196" stroke-width="0.8" stroke-dasharray="2 10" opacity="0.1">
      <animate attributeName="opacity" values="0.06;0.16;0.06" dur="12s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="360 800 175" to="0 800 175" dur="95s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- outer halo glow behind the disk -->
  <circle cx="800" cy="175" r="230" fill="#4C2A9E" opacity="0.14" filter="url(#bh-blurL)">
    <animate attributeName="opacity" values="0.1;0.2;0.1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- ===================== ACCRETION DISK (behind horizon) ===================== -->
  <g filter="url(#bh-blurS)">
    <ellipse cx="800" cy="175" rx="330" ry="86" fill="none" stroke="#2246C4" stroke-width="30" opacity="0.4" stroke-dasharray="10 16" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;-780" dur="30s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="800" cy="175" rx="278" ry="72" fill="none" stroke="#8B3FE8" stroke-width="28" opacity="0.5" stroke-dasharray="8 14" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;-660" dur="22s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="800" cy="175" rx="222" ry="58" fill="none" stroke="#3FD6FF" stroke-width="24" opacity="0.68" stroke-dasharray="6 11" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;-510" dur="15s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="800" cy="175" rx="168" ry="44" fill="none" stroke="#FFF6E4" stroke-width="17" opacity="0.85" stroke-dasharray="4 8" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="0;-380" dur="9s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- orbiting hot knots: differential rotation, inner faster -->
  <circle r="2.6" fill="#FFFFFF" filter="url(#bh-glow)">
    <animateMotion dur="9s" repeatCount="indefinite"><mpath href="#bh-orbitIn"/></animateMotion>
  </circle>
  <circle r="2.2" fill="#8FF0FF" filter="url(#bh-glow)" opacity="0.9">
    <animateMotion dur="15s" repeatCount="indefinite"><mpath href="#bh-orbitMid"/></animateMotion>
  </circle>
  <circle r="2" fill="#C7A6FF" filter="url(#bh-glow)" opacity="0.8">
    <animateMotion dur="22s" repeatCount="indefinite"><mpath href="#bh-orbitOut"/></animateMotion>
  </circle>
  <circle r="1.7" fill="#6C8CE8" filter="url(#bh-glow)" opacity="0.65">
    <animateMotion dur="30s" repeatCount="indefinite"><mpath href="#bh-orbitFar"/></animateMotion>
  </circle>

  <!-- ===================== EVENT HORIZON ===================== -->
  <circle cx="800" cy="175" r="46" fill="url(#bh-horizon)"/>
  <circle cx="800" cy="175" r="46.8" fill="none" stroke="#EAF6FF" stroke-width="1.3" opacity="0.9" filter="url(#bh-blurS)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="175" r="49" fill="none" stroke="#5FDFFF" stroke-width="2.4" opacity="0.35" filter="url(#bh-blurM)">
    <animate attributeName="opacity" values="0.22;0.42;0.22" dur="4.2s" repeatCount="indefinite"/>
  </circle>

  <!-- near-side plasma crescent, passing in front of the horizon -->
  <path d="M 762 206 A 40 13 0 0 0 838 206 A 52 17 0 0 1 762 206 Z" fill="url(#bh-crescent)" opacity="0.5" filter="url(#bh-blurS)">
    <animate attributeName="opacity" values="0.35;0.55;0.35" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- ===================== infalling particles ===================== -->
  <g fill="#CFE9FF">
    <circle r="1.4" opacity="0" filter="url(#bh-glow)">
      <animateMotion dur="7s" repeatCount="indefinite" path="M 300 90 Q 550 140 752 168"/>
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.6;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.2" opacity="0" fill="#8FF0FF" filter="url(#bh-glow)">
      <animateMotion dur="9s" repeatCount="indefinite" path="M 1300 260 Q 1050 210 850 183" begin="1.5s"/>
      <animate attributeName="opacity" values="0;0.85;0" keyTimes="0;0.6;1" dur="9s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle r="1.3" opacity="0" fill="#C7A6FF" filter="url(#bh-glow)">
      <animateMotion dur="8s" repeatCount="indefinite" path="M 250 280 Q 500 230 755 178" begin="3s"/>
      <animate attributeName="opacity" values="0;0.8;0" keyTimes="0;0.6;1" dur="8s" repeatCount="indefinite" begin="3s"/>
    </circle>
    <circle r="1.1" opacity="0" filter="url(#bh-glow)">
      <animateMotion dur="10s" repeatCount="indefinite" path="M 1350 100 Q 1080 140 850 172" begin="0.8s"/>
      <animate attributeName="opacity" values="0;0.75;0" keyTimes="0;0.6;1" dur="10s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle r="1.3" opacity="0" fill="#FFF6E4" filter="url(#bh-glow)">
      <animateMotion dur="6.5s" repeatCount="indefinite" path="M 800 20 Q 800 90 800 131" begin="2.2s"/>
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.6;1" dur="6.5s" repeatCount="indefinite" begin="2.2s"/>
    </circle>
    <circle r="1.2" opacity="0" fill="#8FF0FF" filter="url(#bh-glow)">
      <animateMotion dur="7.5s" repeatCount="indefinite" path="M 800 330 Q 800 250 800 222" begin="4s"/>
      <animate attributeName="opacity" values="0;0.85;0" keyTimes="0;0.6;1" dur="7.5s" repeatCount="indefinite" begin="4s"/>
    </circle>
    <circle r="1.1" opacity="0" filter="url(#bh-glow)">
      <animateMotion dur="9.5s" repeatCount="indefinite" path="M 130 175 Q 400 175 752 175" begin="1s"/>
      <animate attributeName="opacity" values="0;0.75;0" keyTimes="0;0.6;1" dur="9.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle r="1.2" opacity="0" fill="#C7A6FF" filter="url(#bh-glow)">
      <animateMotion dur="8.5s" repeatCount="indefinite" path="M 1470 175 Q 1200 175 850 175" begin="3.6s"/>
      <animate attributeName="opacity" values="0;0.8;0" keyTimes="0;0.6;1" dur="8.5s" repeatCount="indefinite" begin="3.6s"/>
    </circle>
  </g>

  <!-- gravitational distortion ripples emanating from the horizon -->
  <g fill="none" stroke="#7FE9FF">
    <circle cx="800" cy="175" r="55" stroke-width="0.8" opacity="0">
      <animate attributeName="r" values="55;300" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.22;0" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="175" r="55" stroke-width="0.8" opacity="0">
      <animate attributeName="r" values="55;300" dur="13s" begin="4.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.22;0" dur="13s" begin="4.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="175" r="55" stroke-width="0.8" opacity="0">
      <animate attributeName="r" values="55;300" dur="13s" begin="8.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.22;0" dur="13s" begin="8.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===================== occasional energy bursts ===================== -->
  <circle cx="1013" cy="221" r="11" fill="url(#bh-burst)" filter="url(#bh-blurM)" opacity="0">
    <animate attributeName="opacity" values="0;0;0.85;0.2;0" keyTimes="0;0.5;0.6;0.75;1" dur="11s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" additive="sum" values="1;1;1.6;1.1;1" keyTimes="0;0.5;0.6;0.75;1" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="539" cy="150" r="9" fill="url(#bh-burst)" filter="url(#bh-blurM)" opacity="0">
    <animate attributeName="opacity" values="0;0;0.8;0.15;0" keyTimes="0;0.4;0.5;0.68;1" dur="13s" begin="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" additive="sum" values="1;1;1.5;1.1;1" keyTimes="0;0.4;0.5;0.68;1" dur="13s" begin="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="939" cy="113" r="8" fill="url(#bh-burst)" filter="url(#bh-blurM)" opacity="0">
    <animate attributeName="opacity" values="0;0;0.75;0.1;0" keyTimes="0;0.6;0.68;0.82;1" dur="9s" begin="6.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" additive="sum" values="1;1;1.4;1;1" keyTimes="0;0.6;0.68;0.82;1" dur="9s" begin="6.5s" repeatCount="indefinite"/>
  </circle>

</svg>
